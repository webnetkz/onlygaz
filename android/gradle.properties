# Gradle daemon memory: the asset step decodes textures of up to 2048x12288.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# ----------------------------------------------------------------- OnlyGAZ
# Release identity, also read by android/build_apk.sh. versionCode must grow
# with every build uploaded to Google Play or installed over an older one.
onlygaz.versionCode=10003
onlygaz.versionName=1.0.3
onlygaz.minSdk=26
onlygaz.targetSdk=36

# ABIs compiled for APKs and app bundles built outside of Android Studio's
# Run button (Run compiles only the ABI of the selected phone or emulator).
# Comma-separated: arm64-v8a, x86_64, armeabi-v7a, x86.
onlygaz.abis=arm64-v8a

# Optional overrides, best placed in android/local.properties:
#   onlygaz.cargo=/path/to/cargo          (default: ~/.cargo/bin/cargo, then PATH)
#   onlygaz.ndkDir=/path/to/ndk           (default: <sdk>/ndk/<onlygaz.ndkVersion>, then the newest NDK)
#   onlygaz.ndkVersion=27.0.12077973
#   onlygaz.debugCargoProfile=release     (default: android-dev, see android/Cargo.toml)
#   onlygaz.cargoArgs=--locked
#   onlygaz.cargoEnv=KEY=VALUE;KEY2=VALUE2
