# Separate Android build of OnlyGAZ.
#
# This package only wraps the game library (`veyron_sim`, one directory up)
# into the `libonlygaz.so` that Android's NativeActivity loads, with the
# `mobile` feature enabled: touch pedals, steering buttons or tilt steering,
# compact landscape menus and phone graphics defaults. The Windows/macOS game is built
# from the repository root exactly as before and is not affected.
#
# Built by Gradle (Android Studio, `./gradlew bundleRelease`) or by
# `android/build_apk.sh`; see android/README.md.

[package]
name = "onlygaz_android"
version = "1.0.4"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "onlygaz"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
veyron_sim = { path = "..", features = ["mobile"] }
# NativeActivity needs no Java libraries; the small MainActivity subclass
# (app/src/main/java) only adds immersive full screen, cut-out insets and the
# display rotation.
bevy = { version = "0.19", default-features = false, features = ["android-native-activity"] }

# A standalone workspace: the desktop crate at the repository root keeps its
# own Cargo.lock, target directory and release profile.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
# Symbols are not needed on the phone and would triple the APK size.
strip = true

# Android Studio's debug build (Run): release optimisation without LTO, so a
# change to the game re-links in a fraction of the release time and still
# runs at full speed on the phone. Stripped like release: with its symbols
# the library is about 250 MB and every install takes much longer (panic
# messages still name the source file and line in Logcat).
[profile.android-dev]
inherits = "release"
lto = false
incremental = true
codegen-units = 64
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
